<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log in — IKS ControlHub</title>
<style>
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f0f1; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .login-card { background:#fff; border:1px solid #dcdcde; border-radius:6px; padding:32px; width:320px; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  .brand .logo { width:32px; height:32px; background:#2271b1; border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color:#fff; }
  .brand .name { font-size:15px; font-weight:600; color:#1d2327; }
  label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; color:#1d2327; }
  input[type=text], input[type=password] { width:100%; padding:8px 10px; border:1px solid #dcdcde; border-radius:3px; margin-bottom:16px; font-size:13.5px; }
  button { width:100%; padding:8px; border-radius:3px; border:1px solid #2271b1; background:#2271b1; color:#fff; font-size:13.5px; font-weight:600; cursor:pointer; }
  button:hover { background:#135e96; }
  .errorlist { color:#b32d2e; font-size:12px; list-style:none; padding:0; margin:-8px 0 12px; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="brand"><div class="logo">IK</div><div class="name">IKS ControlHub</div></div>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
