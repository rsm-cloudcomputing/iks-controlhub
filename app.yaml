# DigitalOcean App Platform spec.
# Use this either via `doctl apps create --spec app.yaml`, or paste its
# contents into the App Platform UI when creating a new app from your
# GitHub repo. Update "repo" below to your actual GitHub repo path.

name: iks-controlhub
region: fra
services:
  - name: web
    github:
      repo: YOUR_GITHUB_USERNAME/iks-controlhub
      branch: main
      deploy_on_push: true
    build_command: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    run_command: "gunicorn iks_platform.wsgi --bind 0.0.0.0:8080"
    http_port: 8080
    instance_size_slug: basic-xxs
    instance_count: 1
    envs:
      - key: DJANGO_SECRET_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "${APP_DOMAIN}"
      - key: DB_ENGINE
        value: "postgres"
      - key: DB_NAME
        value: "${db.DATABASE}"
      - key: DB_USER
        value: "${db.USERNAME}"
      - key: DB_PASSWORD
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: "${db.PASSWORD}"
      - key: DB_HOST
        value: "${db.HOSTNAME}"
      - key: DB_PORT
        value: "${db.PORT}"

databases:
  - name: db
    engine: PG
    version: "16"
    production: false
